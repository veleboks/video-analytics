services:
  gateway:
    build:
      context: gateway
      dockerfile: Dockerfile
    container_name: video-analytics-gateway
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8000
      S3_ENDPOINT: http://minio:9000
    ports:
      - "8001:8001"
    depends_on:
      - orchestrator
    networks:
      - video-analytics-network
    restart: unless-stopped

  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: video-analytics-orchestrator
    environment:
      CONFIG_PATH: docker.yaml
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - video-analytics-network
    restart: unless-stopped

  runner:
    build:
      context: ./runner
      dockerfile: Dockerfile
    environment:
      CONFIG_PATH: docker.yaml
      HEARTBEAT_INTERVAL: 10
    volumes:
      - video_data:/app/videos
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      detection:
        condition: service_healthy
    networks:
      - video-analytics-network
    restart: always
    healthcheck:
      test: ["CMD", "pgrep", "-f", "python.*main.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s

  detection:
    build:
      context: ./detection
      dockerfile: Dockerfile
    container_name: video-analytics-detection
    volumes:
      - model_data:/app/models
    ports:
      - "8004:8004"
    networks:
      - video-analytics-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:15-alpine
    container_name: video-analytics-postgres
    environment:
      POSTGRES_USER: vidanalytics
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: vidanalytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-runner-db.sql:/docker-entrypoint-initdb.d/init-runner-db.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U vidanalytics" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - video-analytics-network

  zookeeper:
    container_name: video-analytics-zookeeper
    image: confluentinc/cp-zookeeper:latest
    restart: unless-stopped
    ports:
      - '2181:2181'
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_MAX_CLIENT_CNXNS: 60
      ZK_LOG4J_ROOT_LOGLEVEL: "WARN"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - video-analytics-network
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: video-analytics-kafka-ui
    ports:
      - "8084:8080"
    restart: unless-stopped
    environment:
      - KAFKA_CLUSTERS_0_NAME=dev-local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
    depends_on:
      zookeeper:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - video-analytics-network

  kafka:
    container_name: video-analytics-kafka
    image: confluentinc/cp-kafka:7.4.4
    restart: unless-stopped
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG4J_ROOT_LOGLEVEL: "WARN"
      KAFKA_LOG4J_LOGGERS: "kafka.controller=WARN,state.change.logger=WARN"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - video-analytics-network
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    command: >
      sh -c "echo 'Waiting for Zookeeper to be ready...'; while ! nc -z zookeeper 2181; do sleep 1; done; echo 'Zookeeper is ready, starting Kafka...'; /etc/confluent/docker/run & while ! kafka-topics --bootstrap-server localhost:9092 --list; do sleep 5; done; echo 'Kafka is ready, creating topics...'; kafka-topics --create --bootstrap-server kafka:9092 --replication-factor 1 --partitions 1 --topic video-scenarios --if-not-exists; kafka-topics --create --bootstrap-server kafka:9092 --replication-factor 1 --partitions 1 --topic heartbeats --if-not-exists; echo 'Topics created, waiting...'; wait"

  minio:
    image: bitnami/minio:latest
    container_name: video-analytics-minio
    environment:
      MINIO_ROOT_USER: minio-access-key
      MINIO_ROOT_PASSWORD: minio-secret-key
      MINIO_DEFAULT_BUCKETS: "frames,predictions"  # Создаём бакет при запуске
    ports:
      - "9000:9000"  # доступ для API
      - "9001:9001"  # доступ для Web UI
    volumes:
      - minio_data:/data
    networks:
      - video-analytics-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  video-analytics-network:
    driver: bridge

volumes:
  postgres_data:
  video_data:
  model_data:
  minio_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
